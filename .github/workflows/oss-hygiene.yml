name: oss-hygiene
on: [push, pull_request]
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for company-specific values
        run: |
          # Replace these placeholders with your real past-employer / domain patterns.
          EMPLOYER_PATTERNS='acme-corp|example-employer|your-org-internal'
          EMAIL_PATTERNS='@example\.com'  # tighten to your real domains locally
          ACCOUNT_IDS='000000000000'      # add any real account ids to catch
          FAIL=0
          for pat in "$EMPLOYER_PATTERNS" "$ACCOUNT_IDS"; do
            if grep -rniE "$pat" --include='*.py' --include='*.toml' --include='*.md' \
                 --exclude-dir='.git' --exclude-dir='docs' . ; then
              echo "::error::oss-hygiene: matched forbidden pattern: $pat"; FAIL=1
            fi
          done
          exit $FAIL

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "error-budget-gate"
version = "0.1.0a1"
description = "An error-budget gate for automated remediation. Automation may propose the fix; the error budget decides whether it acts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "June Gu" }]
keywords = ["sre", "error-budget", "slo", "remediation", "automation", "guardrail", "aiops"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/JIUNG9/error-budget-gate"
Source = "https://github.com/JIUNG9/error-budget-gate"
Changelog = "https://github.com/JIUNG9/error-budget-gate/blob/main/CHANGELOG.md"
Issues = "https://github.com/JIUNG9/error-budget-gate/issues"

[tool.hatch.build.targets.wheel]
packages = ["budgetgate"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
